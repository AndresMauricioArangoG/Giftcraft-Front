<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giftcraft</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--Iconos Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    <!-- Fuentes: pixel (títulos) + Inter (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Electrolize&family=Erica+One&family=Gugi&family=Londrina+Shadow&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Rubik+Spray+Paint&family=Stardos+Stencil:wght@400;700&family=Stick+No+Bills:wght@200..800&family=Unica+One&family=WDXL+Lubrifont+JP+N&display=swap"
        rel="stylesheet">
    <link href="CSS/style.css" rel="stylesheet">
</head>

<body>
    <div id="carouselExampleDark" class="carousel carousel-dark slide">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="100">
                <img src="./ASSETS/img/carrusel/fondo1-carrusel.png" class="d-block w-100" alt="Imagen de Bienvenida">

                <!-- Se agregaron clases para alinear a la izquierda (text-start, start-0) y quitar el centrado por defecto -->
                <div class="carousel-caption text-start start-0 translate-middle-x-0 ms-5"
                    style="width: 500px; top: 20%;">
                    <p class="fs-2 text-dark mb-1">Figuras de madera inspiradas en</p>
                    <h1 class="fw-bold text-dark mb-3" style="font-family: sans-serif; font-size: 3.5rem;">Minecraft
                    </h1>
                    <p class="fs-4 text-dark mb-4">Detalles únicos que dan vida <br> a tus ideas.</p>
                    <a href="#" class="btn btn-lg text-white px-4 py-2"
                        style="background-color: #d87093; border-radius: 50px;">
                        <i class="bi bi-arrow-right-short"></i> Ver productos
                    </a>
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="2000">
                <img src="./ASSETS/img/carrusel/fondo1-carrusel.png" class="d-block w-100" alt="...">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Second slide label</h5>
                    <p>Some representative placeholder content for the second slide.</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="./ASSETS/img/carrusel/fondo1-carrusel.png" class="d-block w-100" alt="...">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Third slide label</h5>
                    <p>Some representative placeholder content for the third slide.</p>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- personal JS -->
    <script src="/JS/script.js"></script>
</body>

</html>
